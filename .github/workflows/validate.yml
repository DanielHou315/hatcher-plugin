name: Validate plugin

# Verify the plugin on every pull request and on every push to main. The
# validator checks both manifests (and their parity), the generated catalog
# (including that it is not stale), component frontmatter, and referenced paths.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y jq
          fi
          jq --version

      - name: Validate plugin (Claude Code + Cursor + Codex)
        run: bash scripts/validate_plugin.sh --strict

  mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: The committed bundle matches the source
        run: npm run build && git diff --exit-code dist
